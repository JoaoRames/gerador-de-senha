<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS-DOS PASSWORD GENERATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <p style="color: #888; font-size: 1.1rem; margin-bottom: 5px;">MICROSOFT(R) MS-DOS(R) VERSION 6.22</p>
        <p style="color: #888; font-size: 1.1rem; margin-bottom: 20px;">(C)COPYRIGHT MICROSOFT CORP 1981-1994.</p>
        
        <h2>C:\> PWD_GEN.EXE</h2>
        
        <div class="result-container">
            <span id="password-display">Sua senha aparecerá aqui</span>
            <button id="copy-btn" title="Copiar senha">[COPIAR]</button>
        </div>

        <div class="options">
            <div class="option">
                <label for="length">TAMANHO DA SENHA (<span id="length-val">12</span>):</label>
                <input type="range" id="length" min="6" max="32" value="12">
            </div>

            <div class="option">
                <label>
                    <input type="checkbox" id="uppercase" checked> INCLUIR MAIUSCULAS [A-Z]
                </label>
            </div>

            <div class="option">
                <label>
                    <input type="checkbox" id="lowercase" checked> INCLUIR MINUSCULAS [a-z]
                </label>
            </div>

            <div class="option">
                <label>
                    <input type="checkbox" id="numbers" checked> INCLUIR NUMEROS [0-9]
                </label>
            </div>

            <div class="option">
                <label>
                    <input type="checkbox" id="symbols"> INCLUIR SIMBOLOS [!@#$]
                </label>
            </div>
        </div>

        <button id="generate-btn" class="generate-btn">> EXECUTAR GERADOR</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
